name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test (includes stale-adapter, snapshot and built-wheel checks)
        run: python -m pytest -q
      - name: Adapters are up to date
        shell: bash
        run: |
          python -m openfusion render all --out adapters
          git diff --exit-code -- adapters core/router/openfusion/_data

  wheel:
    name: build + smoke-test wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - name: uvx from the wheel, outside the checkout, without PyYAML
        run: |
          whl="$(ls "$PWD"/dist/openfusion-*.whl)"
          cd "$(mktemp -d)" && mkdir repo
          uvx --from "$whl" openfusion --version
          uvx --from "$whl" openfusion list-harnesses
          uvx --from "$whl" openfusion install claude-code repo
          test -f repo/.claude/agents/fusion-deep.md
          python3 repo/.claude/skills/openfusion/scripts/route.py "rename foo to bar"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
